name: macOS installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to
        required: true
        default: v0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apple-silicon:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-aarch64

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Apple Silicon installer
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Upload installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS DMG was produced."
            find src-tauri/target/aarch64-apple-darwin/release/bundle -type f
            exit 1
          fi
          printf 'Uploading:\n'
          printf '  %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
